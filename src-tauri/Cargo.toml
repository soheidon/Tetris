[package]
name = "falling_blocks"
version = "1.0.0"
description = "Falling Blocks Desktop Game"
authors = ["soheidon <soheidon@yahoo.co.jp>"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "falling_blocks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
